<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal com Player do Servidor - Canais e Guia de Jogos</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #07090e; color: #f1f5f9; line-height: 1.5; }
    header { background: #0f1420; border-bottom: 1px solid rgba(255,255,255,0.08); padding: 14px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .brand { display: flex; align-items: center; gap: 10px; font-size: 1.15rem; font-weight: 800; color: #ffffff; text-decoration: none; }
    .brand-icon { width: 28px; height: 28px; background: #dc2626; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #fff; font-weight: bold; }
    .main-container { max-width: 1600px; margin: 0 auto; padding: 20px; display: grid; grid-template-columns: 1fr 340px; gap: 24px; }
    @media (max-width: 1024px) { .main-container { grid-template-columns: 1fr; } }
    .player-wrapper { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 20px 40px rgba(0,0,0,0.6); }
    .player-wrapper iframe { width: 100%; height: 100%; border: 0; }
    .player-details { background: #0f1420; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 18px; margin-top: 14px; }
    .channel-header { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
    .current-title { font-size: 1.4rem; font-weight: 800; color: #fff; }
    .current-desc { font-size: 0.85rem; color: #94a3b8; margin-top: 4px; }
    .btn-direct { background: #dc2626; color: #fff; text-decoration: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; display: inline-flex; align-items: center; gap: 6px; }
    .sidebar { background: #0f1420; border: 1px solid rgba(255,255,255,0.06); border-radius: 12px; padding: 16px; height: fit-content; max-height: calc(100vh - 120px); overflow-y: auto; }
    .sidebar-title { font-size: 0.95rem; font-weight: 700; color: #fff; margin-bottom: 14px; }
    .channel-item { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px; border-radius: 8px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.04); margin-bottom: 8px; cursor: pointer; }
    .channel-item:hover, .channel-item.active { background: rgba(220, 38, 38, 0.15); border-color: rgba(220, 38, 38, 0.5); }
    .item-info { flex: 1; }
    .item-name { font-size: 0.85rem; font-weight: 700; color: #fff; }
    .item-net { font-size: 0.75rem; color: #94a3b8; }
    .btn-server-mini { background: rgba(220, 38, 38, 0.2); border: 1px solid rgba(220, 38, 38, 0.4); color: #ef4444; font-size: 0.7rem; font-weight: 700; padding: 4px 8px; border-radius: 6px; text-decoration: none; }
  </style>
</head>
<body>
  <header>
    <a href="#" class="brand">
      <div class="brand-icon">▶</div>
      <span>PLAYER DO SERVIDOR & GUIA DE JOGOS</span>
    </a>
    <span style="font-size: 0.75rem; color: #ef4444; font-weight: bold;">redecanais.by/player3</span>
  </header>

  <div class="main-container">
    <div class="player-section">
      <div class="player-wrapper">
        <iframe id="main-player" src="https://redecanais.by/player3/ch.php?canal=premiereclubes" allowfullscreen allow="autoplay; fullscreen; encrypted-media"></iframe>
      </div>
      <div class="player-details">
        <div class="channel-header">
          <div>
            <div id="channel-name" class="current-title">PREMIERE C</div>
            <div id="channel-desc" class="current-desc">Transmissão Premiere Clubes: Campeonato Brasileiro Série A</div>
          </div>
          <a id="btn-direct-link" href="https://redecanais.by/player3/ch.php?canal=premiereclubes" target="_blank" rel="noopener noreferrer" class="btn-direct">
            Abrir Player do Servidor ↗
          </a>
        </div>
      </div>
    </div>

    <div class="sidebar">
      <div class="sidebar-title">Lista de Canais (20)</div>
      <div id="channels-list"></div>
    </div>
  </div>

  <script>
    const channels = [
      { name: "PREMIERE C", net: "Premiere", desc: "Premiere Clubes ao Vivo", url: "https://redecanais.by/player3/ch.php?canal=premiereclubes" },
      { name: "PREMIERE 2", net: "Premiere", desc: "Canal Premiere 2", url: "https://redecanais.by/player3/ch.php?canal=premiere2" },
      { name: "PREMIERE 3", net: "Premiere", desc: "Canal Premiere 3", url: "https://redecanais.by/player3/ch.php?canal=premiere3" },
      { name: "PREMIERE 4", net: "Premiere", desc: "Canal Premiere 4", url: "https://redecanais.by/player3/ch.php?canal=premiere4" },
      { name: "PREMIERE 5", net: "Premiere", desc: "Canal Premiere 5", url: "https://redecanais.by/player3/ch.php?canal=premiere5" },
      { name: "PREMIERE 6", net: "Premiere", desc: "Canal Premiere 6", url: "https://redecanais.by/player3/ch.php?canal=premiere6" },
      { name: "PREMIERE 7", net: "Premiere", desc: "Canal Premiere 7", url: "https://redecanais.by/player3/ch.php?canal=premiere7" },
      { name: "SPORTV 1", net: "SporTV", desc: "SporTV Principal", url: "https://redecanais.by/player3/ch.php?canal=sportv1" },
      { name: "SPORTV 2", net: "SporTV", desc: "SporTV 2 Vôlei e NBB", url: "https://redecanais.by/player3/ch.php?canal=sportv2" },
      { name: "SPORTV 3", net: "SporTV", desc: "SporTV 3 Multiesportes", url: "https://redecanais.by/player3/ch.php?canal=sportv3" },
      { name: "SPORTYNET 1", net: "Sportynet", desc: "Sportynet 1 Digital", url: "https://redecanais.by/player3/ch.php?canal=sportynet1" },
      { name: "SPORTYNET 2", net: "Sportynet", desc: "Sportynet 2 Futebol", url: "https://redecanais.by/player3/ch.php?canal=sportynet2" },
      { name: "SPORTYNET 3", net: "Sportynet", desc: "Sportynet 3 Lutas", url: "https://redecanais.by/player3/ch.php?canal=sportynet3" },
      { name: "ESPN 1", net: "ESPN", desc: "ESPN Principal Premier League", url: "https://redecanais.by/player3/ch.php?canal=espn" },
      { name: "ESPN 2", net: "ESPN", desc: "ESPN 2 NFL e NBA", url: "https://redecanais.by/player3/ch.php?canal=espn2" },
      { name: "ESPN 3", net: "ESPN", desc: "ESPN 3 Ligas Europeias", url: "https://redecanais.by/player3/ch.php?canal=espn3" },
      { name: "ESPN 4", net: "ESPN", desc: "ESPN 4 Tênis e Rugby", url: "https://redecanais.by/player3/ch.php?canal=espn4" },
      { name: "ESPN 5", net: "ESPN", desc: "ESPN 5 Futebol Holandês", url: "https://redecanais.by/player3/ch.php?canal=espn5" },
      { name: "ESPN 6", net: "ESPN", desc: "ESPN 6 Quadras Extras", url: "https://redecanais.by/player3/ch.php?canal=espn6" },
      { name: "BANDSPORTS", net: "BandSports", desc: "BandSports F1 e Motor", url: "https://redecanais.by/player3/ch.php?canal=bandsports" }
    ];

    const list = document.getElementById('channels-list');
    const player = document.getElementById('main-player');
    const titleEl = document.getElementById('channel-name');
    const descEl = document.getElementById('channel-desc');
    const directBtn = document.getElementById('btn-direct-link');

    channels.forEach((ch, idx) => {
      const item = document.createElement('div');
      item.className = 'channel-item' + (idx === 0 ? ' active' : '');
      item.innerHTML = '<div class="item-info"><div class="item-name">' + ch.name + '</div><div class="item-net">' + ch.desc + '</div></div>' +
                       '<a href="' + ch.url + '" target="_blank" class="btn-server-mini" onclick="event.stopPropagation()">Abrir ↗</a>';
      item.onclick = () => {
        document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
        item.classList.add('active');
        player.src = ch.url;
        titleEl.textContent = ch.name;
        descEl.textContent = ch.desc;
        directBtn.href = ch.url;
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      list.appendChild(item);
    });
  </script>
</body>
</html>
