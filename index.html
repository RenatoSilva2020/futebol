    function getDeviceDateLabel() {
      const now = new Date();
      const days = ['Domingo', 'Segunda', 'Terça', 'Quarta', 'Quinta', 'Sexta', 'Sábado'];
      const dayName = days[now.getDay()];
      const d = String(now.getDate()).padStart(2, '0');
      const m = String(now.getMonth() + 1).padStart(2, '0');
      return `${dayName} – ${d}/${m}`;
    }

    function getTeamBadgeHtml(teamName) {
      if (!teamName) return '';
      const norm = teamName.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').trim();
      let slug = TEAM_SLUGS[norm];
      if (!slug) {
        for (const k in TEAM_SLUGS) {
          if (norm.includes(k) || k.includes(norm)) {
            slug = TEAM_SLUGS[k];
            break;
          }
        }
      }
      const initials = (teamName.slice(0, 3)).toUpperCase();
      if (!slug) {
        slug = norm.split(' ').join('-');
      }

      let template = "https://bolarolando.org/escudos/{slug}.webp";
      if (template.includes('corinthians.webp')) {
        template = template.replace('corinthians.webp', '{slug}.webp');
      }

      const bolarolandoMap = {
        'sao-paulo': 'spfc', 'sao paulo': 'spfc', 'spfc': 'spfc',
        'atletico-mineiro': 'mg', 'atletico mineiro': 'mg', 'atletico-mg': 'mg',
        'athletico-paranaense': 'pr', 'athletico-pr': 'pr',
        'santos-fc': 'santos', 'vasco-da-gama': 'vasco',
        'aa-ponte-preta': 'ponte', 'ponte-preta': 'ponte', 'ponte preta': 'ponte',
        'red-bull-bragantino': 'bragantino', 'real-madrid': 'madrid',
        'manchester-city': 'city', 'paris-saint-germain': 'psg', 'psg': 'psg',
        'fc-barcelona': 'barcelona', 'al-nassr': 'nassr', 'al-kholood': 'kholood'
      };
      const effectiveSlug = bolarolandoMap[slug] || bolarolandoMap[norm] || slug.replace(/-fc$/, '').replace(/-sc$/, '').replace(/-ec$/, '');
      
      let url = template;
      if (url.includes('{slug}')) {
        url = url.split('{slug}').join(effectiveSlug);
      } else if (url.includes('{name}')) {
        url = url.split('{name}').join(effectiveSlug);
      } else {
        const base = url.endsWith('/') ? url.slice(0, -1) : url;
        url = base + '/' + effectiveSlug + '.webp';
      }

      return '<span style="display:inline-flex;align-items:center;justify-content:center;position:relative;width:26px;height:26px;flex-shrink:0;"><img src="' + url + '" alt="' + teamName + '" style="width:26px;height:26px;object-fit:contain;" onerror="this.style.display=\'none\';if(this.nextElementSibling)this.nextElementSibling.style.display=\'inline-flex\';"><span style="display:none;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#1e293b;border:1px solid rgba(255,255,255,0.1);color:#fff;font-size:9px;font-weight:900;">' + initials + '</span></span>';
    }

    function parseMatchesHtml(html) {
      const dateMatch = html.match(/<h2><span[^>]*>(.*?)<\/span><\/h2>/i);
      const dateLabel = dateMatch ? dateMatch[1].replace(/&#8211;/g, '–').trim() : DEFAULT_DATE;
      document.getElementById('date-label').textContent = 'Fonte Mantos do Futebol · ' + dateLabel;

      const regex = /<h3><strong>(.*?)<\/strong><\/h3>[\s\S]*?<p><span[^>]*><strong>Canais:\s*(.*?)<\/strong><\/span><\/p>/gi;
      let m;
      const list = [];
      while ((m = regex.exec(html)) !== null) {
        const rawTitle = m[1].replace(/&#8211;/g, '–').replace(/&amp;/g, '&').trim();
        const rawChannels = m[2].replace(/&#8211;/g, '–').replace(/&amp;/g, '&').trim();
        const parts = rawTitle.split('–').map(s => s.trim());
        const time = parts[0] || '';
        const confrontation = parts[1] || '';
        const championship = parts.slice(2).join(' – ') || '';

        let matchedId = null;
        let matchedName = null;
        const chLower = rawChannels.toLowerCase();
        if (chLower.includes('premiere')) { matchedId = 'premiere-c'; matchedName = 'PREMIERE'; }
        else if (chLower.includes('sportv 2')) { matchedId = 'sportv-2'; matchedName = 'SPORTV 2'; }
        else if (chLower.includes('sportv 3')) { matchedId = 'sportv-3'; matchedName = 'SPORTV 3'; }
        else if (chLower.includes('sportv')) { matchedId = 'sportv-1'; matchedName = 'SPORTV 1'; }
        else if (chLower.includes('espn 2')) { matchedId = 'espn-2'; matchedName = 'ESPN 2'; }
        else if (chLower.includes('espn 3')) { matchedId = 'espn-3'; matchedName = 'ESPN 3'; }
        else if (chLower.includes('espn 4')) { matchedId = 'espn-4'; matchedName = 'ESPN 4'; }
        else if (chLower.includes('espn')) { matchedId = 'espn-1'; matchedName = 'ESPN 1'; }
        else if (chLower.includes('sportynet')) { matchedId = 'sportynet-1'; matchedName = 'SPORTYNET'; }
        else if (chLower.includes('bandsports')) { matchedId = 'bandsports'; matchedName = 'BANDSPORTS'; }

        list.push({
          time,
          confrontation,
          championship,
          channels: rawChannels,
          matchedId,
          matchedName,
          available: Boolean(matchedId)
        });
      }
      return list;
    }

    function renderMatches() {
      const container = document.getElementById('matches-container');
      const q = (document.getElementById('search-box').value || '').toLowerCase().trim();

      const filtered = allMatches.filter(m => {
        if (currentFilter === 'available' && !m.available) return false;
        if (currentFilter === 'brasileirao' && !m.championship.toLowerCase().includes('brasileir')) return false;
        if (currentFilter === 'seriea' && !m.championship.toLowerCase().includes('serie a')) return false;
        if (currentFilter === 'copas' && !m.championship.toLowerCase().includes('copa') && !m.championship.toLowerCase().includes('libertadores')) return false;
        if (q && !m.confrontation.toLowerCase().includes(q) && !m.championship.toLowerCase().includes(q) && !m.channels.toLowerCase().includes(q)) return false;
        return true;
      });

      if (filtered.length === 0) {
        container.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #94a3b8;">Nenhum jogo encontrado com esse filtro.</div>';
        return;
      }

      container.innerHTML = '';
      filtered.forEach(m => {
        const parts = m.confrontation.split(' x ').map(s => s.trim());
        const homeTeam = parts[0] || m.confrontation;
        const awayTeam = parts[1] || '';
        const homeBadge = getTeamBadgeHtml(homeTeam);
        const awayBadge = awayTeam ? getTeamBadgeHtml(awayTeam) : '';

        const card = document.createElement('div');
        card.className = 'match-card';
        card.innerHTML = `
          <div>
            <div class="match-header">
              <span class="match-time">${m.time}</span>
              <span class="match-champ">${m.championship}</span>
            </div>
            
            <div style="margin: 10px 0; padding: 8px 10px; background: rgba(0,0,0,0.4); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: space-between; gap: 8px;">
              <div style="display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0;">
                ${homeBadge}
                <span style="font-weight: 800; font-size: 0.85rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${homeTeam}</span>
              </div>
              <span style="background: rgba(220,38,38,0.2); color: #f87171; border: 1px solid rgba(220,38,38,0.4); border-radius: 6px; font-size: 10px; font-weight: 900; padding: 2px 6px; flex-shrink: 0;">VS</span>
              <div style="display: flex; align-items: center; justify-content: flex-end; gap: 8px; flex: 1; min-width: 0; text-align: right;">
                <span style="font-weight: 800; font-size: 0.85rem; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${awayTeam || 'A definir'}</span>
                ${awayBadge}
              </div>
            </div>

            <div class="match-channels"><strong>Canais:</strong> ${m.channels}</div>
          </div>
          <div style="display:flex; justify-content:space-between; align-items:center; margin-top: 10px;">
            ${m.available ? `<button class="btn-watch" onclick="playChannel('${m.matchedId}')">Assistir no ${m.matchedName} ▶</button>` : `<span style="font-size:0.75rem; color:#64748b;">Streaming / Externa</span>`}
          </div>
        `;
        container.appendChild(card);
      });
    }

    function setFilter(type, btn) {
      currentFilter = type;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderMatches();
    }

    // Live update check (background non-blocking, preserves DEFAULT_MATCHES)
    async function checkLiveUpdates(isManual = false) {
      const statusBadge = document.getElementById('status-badge');
      const curDate = getDeviceDateLabel();
      const dateLabelEl = document.getElementById('date-label');
      if (dateLabelEl) dateLabelEl.textContent = 'Fonte Mantos do Futebol · ' + curDate;
      if (isManual && statusBadge) statusBadge.textContent = 'Verificando atualizações...';

      try {
        // 1. Try local backend
        try {
          const res = await fetch('/api/jogos-hoje?refresh=' + (isManual ? 'true' : 'false') + '&clientDate=' + encodeURIComponent(curDate) + '&_t=' + Date.now());
          if (res.ok) {
            const data = await res.json();
            if (data.matches && data.matches.length > 0) {
              if (dateLabelEl) dateLabelEl.textContent = 'Fonte Mantos do Futebol · ' + (data.dateLabel || curDate);
              allMatches = data.matches.map(m => ({
                time: m.time,
                confrontation: m.confrontation,
                championship: m.championship,
                channels: m.channelsRaw,
                matchedId: m.matchedChannel ? m.matchedChannel.id : null,
                matchedName: m.matchedChannel ? m.matchedChannel.name : null,
                available: m.isAvailableInApp
              }));
              renderMatches();
              if (statusBadge) statusBadge.textContent = '● Jogos atualizados ao vivo';
              return;
            }
          }
        } catch(e) {}

        // 2. Try proxy for GitHub Pages
        const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent('https://mantosdofutebol.com.br/guia-de-jogos-tv-hoje-ao-vivo/') + '&_t=' + Date.now();
        const proxyRes = await fetch(proxyUrl);
        if (proxyRes.ok) {
          const html = await proxyRes.text();
          const parsed = parseMatchesHtml(html);
          if (parsed && parsed.length > 0) {
            allMatches = parsed;
            renderMatches();
            if (statusBadge) statusBadge.textContent = '● Jogos atualizados via Mantos';
            return;
          }
        }
      } catch(err) {
        console.log('Usando grade em cache offline:', err);
      }

      // If background fetch failed, keep allMatches intact!
      if (statusBadge) statusBadge.textContent = '● Grade do dia ativa (' + allMatches.length + ' jogos)';
    }

    // INITIALIZE: Render immediately from DEFAULT_MATCHES!
    const initDate = getDeviceDateLabel() || DEFAULT_DATE;
    const initialDateLabelEl = document.getElementById('date-label');
    if (initialDateLabelEl) initialDateLabelEl.textContent = 'Fonte Mantos do Futebol · ' + initDate;
    renderMatches();
    // Then attempt background refresh
    setTimeout(() => checkLiveUpdates(false), 800);
  </script>
